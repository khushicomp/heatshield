version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 24
            - nvm use 24
            - npm ci
        build:
          commands:
            - npm test
            - npm run build:deploy
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - ~/.npm/**/*
